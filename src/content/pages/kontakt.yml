innerPower:
  heading: Din inre kraft
  text: |-
    Välkommen till en varm gemenskap med energiövningar, inspiration och små påminnelser om att möta dig själv med mer omtanke, närvaro och tillit.

    Medlemsportalen Din Inre Kraft är min kostnadsfria Facebookgrupp där jag delar inspiration, energiövningar och reflektioner för dig som vill skapa mer balans, närvaro och kontakt med dig själv i vardagen.

    I gruppen hittar du enkla övningar, inspiration och reflektioner kring Change Work, våra känslor, upplevelser, mönster och inre utveckling. Här har du också möjlighet att ställa frågor om du vill. Ibland har vi även kortdragningar med orakelkort som en hjälp till reflektion, fördjupning och inspiration.

    Det är en trygg plats där du får fylla på, landa i dig själv och påminnas om den kraft, visdom och möjlighet till förändring som redan finns inom dig.
  closing: Varmt välkommen!
  buttonText: Bli medlem i Din Inre Kraft
  buttonLink: https://www.facebook.com/groups/2725402944445316/
