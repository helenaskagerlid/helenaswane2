intro:
  heading: Ser fram emot att höra från dig
  text: |-
    Vill du boka en session, ställa frågor eller veta mer om hur transformativ coaching kan vara en hjälp för dig?

    Varmt välkommen att fylla i formuläret nedan, så återkommer jag så snart jag har möjlighet.
