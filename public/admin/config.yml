backend:
  name: github
  repo: helenaskagerlid/helenaswane2
  branch: main
  # Inloggningen sköts av sajtens egna funktioner i /api
  base_url: https://helenaswane2.vercel.app
  auth_endpoint: api/auth

# Gör att `npm run cms` fungerar lokalt utan inloggning
local_backend: true

media_folder: "public/media"
public_folder: "/media"

locale: "sv"

collections:
  - name: "blog"
    label: "Blogginlägg"
    label_singular: "Blogginlägg"
    folder: "src/content/blog-posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} – {{pubDate}}"
    sortable_fields: ["pubDate", "title"]
    fields:
      - label: "Rubrik"
        name: "title"
        widget: "string"
      - label: "Publiceringsdatum"
        name: "pubDate"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: "Huvudbild"
        name: "image"
        widget: "image"
        hint: "Visas överst i inlägget och i listan på bloggsidan."
      - label: "Bildbeskrivning (alt-text)"
        name: "imageAlt"
        widget: "string"
        required: false
        hint: "Kort beskrivning av bilden för skärmläsare och SEO."
      - label: "Ingress"
        name: "description"
        widget: "text"
        required: false
        hint: "Kort text som visas i listan på bloggsidan. Lämnas den tom används början av texten."
      - label: "Utkast"
        name: "draft"
        widget: "boolean"
        default: false
        hint: "Kryssa i för att spara utan att publicera på sajten."
      - label: "Innehåll"
        name: "body"
        widget: "markdown"
        hint: "Skriv texten här. Använd bildknappen i verktygsfältet för att lägga in bilder i texten."

  - name: "pages"
    label: "Sidor"
    files:
      - name: "startsida"
        label: "Startsida"
        file: "src/content/pages/startsida.yml"
        format: "yaml"
        # Bilderna hamnar i src/assets så att Astro kan optimera dem
        media_folder: "/src/assets/media"
        public_folder: "/src/assets/media"
        fields:
          - label: "Toppbild"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - label: "Rubrik"
                name: "heading"
                widget: "string"
              - label: "Bild"
                name: "image"
                widget: "image"
                hint: "Stor bild överst på startsidan. Välj en liggande bild."
          - label: "Transformativ coaching"
            name: "coaching"
            widget: "object"
            collapsed: false
            fields:
              - label: "Rubrik"
                name: "heading"
                widget: "string"
              - label: "Underrubrik"
                name: "subheading"
                widget: "string"
                required: false
              - label: "Text"
                name: "text"
                widget: "text"
                hint: "Lämna en tom rad mellan stycken."
              - label: "Avslutande rad (kursiv)"
                name: "closing"
                widget: "text"
                required: false
              - label: "Text på knappen"
                name: "buttonText"
                widget: "string"
                hint: "Knappen leder till kontaktsidan."
              - label: "Bild"
                name: "image"
                widget: "image"
              - label: "Bildbeskrivning (alt-text)"
                name: "imageAlt"
                widget: "string"
                hint: "Kort beskrivning av bilden för skärmläsare och Google."
          - label: "Omdömen"
            name: "testimonials"
            widget: "object"
            collapsed: false
            fields:
              - label: "Rubrik"
                name: "heading"
                widget: "string"
              - label: "Underrubrik"
                name: "subheading"
                widget: "string"
                required: false
              - label: "Bild"
                name: "image"
                widget: "image"
                hint: "Visas rund bredvid omdömena."
              - label: "Bildbeskrivning (alt-text)"
                name: "imageAlt"
                widget: "string"
                hint: "Kort beskrivning av bilden för skärmläsare och Google."
              - label: "Omdömen"
                name: "items"
                widget: "list"
                label_singular: "omdöme"
                summary: "{{fields.name}}"
                hint: "Visas ett i taget i ett bildspel. Dra för att ändra ordningen."
                fields:
                  - label: "Omdöme"
                    name: "quote"
                    widget: "text"
                  - label: "Namn"
                    name: "name"
                    widget: "string"
      - name: "transformativcoaching"
        label: "Transformativ coaching"
        file: "src/content/pages/transformativcoaching.yml"
        format: "yaml"
        fields:
          - label: "Rubrik"
            name: "heading"
            widget: "string"
          - label: "Text"
            name: "text"
            widget: "text"
            hint: "Lämna en tom rad mellan stycken."
      - name: "ommig"
        label: "Om mig"
        file: "src/content/pages/ommig.yml"
        format: "yaml"
        # Bilderna hamnar i src/assets så att Astro kan optimera dem
        media_folder: "/src/assets/media"
        public_folder: "/src/assets/media"
        fields:
          - label: "Rubrik"
            name: "heading"
            widget: "string"
          - label: "Text"
            name: "text"
            widget: "text"
            hint: "Lämna en tom rad mellan stycken."
          - label: "Bild"
            name: "image"
            widget: "image"
            hint: "Visas framför den rosa formen. Fungerar bäst med en bild med genomskinlig bakgrund (PNG)."
          - label: "Bildbeskrivning (alt-text)"
            name: "imageAlt"
            widget: "string"
            hint: "Kort beskrivning av bilden för skärmläsare och Google."
      - name: "kontakt"
        label: "Kontakt / Boka"
        file: "src/content/pages/kontakt.yml"
        format: "yaml"
        fields:
          - label: "Överst på sidan"
            name: "intro"
            widget: "object"
            collapsed: false
            fields:
              - label: "Rubrik"
                name: "heading"
                widget: "string"
              - label: "Text ovanför formuläret"
                name: "text"
                widget: "text"
                hint: "Lämna en tom rad mellan stycken."
          - label: "Blomavdelaren"
            name: "divider"
            widget: "object"
            collapsed: false
            fields:
              - label: "Bild"
                name: "image"
                widget: "image"
                hint: "Visas som en smal remsa som tonar ut. Välj en bred bild där motivet fyller hela bredden."
          - label: "Din inre kraft"
            name: "innerPower"
            widget: "object"
            collapsed: false
            fields:
              - label: "Rubrik"
                name: "heading"
                widget: "string"
              - label: "Text"
                name: "text"
                widget: "text"
                hint: "Lämna en tom rad mellan stycken."
              - label: "Avslutande rad (kursiv)"
                name: "closing"
                widget: "string"
                required: false
              - label: "Text på knappen"
                name: "buttonText"
                widget: "string"
              - label: "Knappens länk"
                name: "buttonLink"
                widget: "string"
                hint: "Hela adressen, till exempel länken till Facebookgruppen."
      - name: "nyhetsbrev"
        label: "Nyhetsbrev (startsidan och kontaktsidan)"
        file: "src/content/pages/nyhetsbrev.yml"
        format: "yaml"
        fields:
          - label: "Rubrik (skrivstil)"
            name: "heading"
            widget: "string"
          - label: "Underrubrik"
            name: "subheading"
            widget: "string"
          - label: "Kursiv rad under underrubriken"
            name: "tagline"
            widget: "string"
            required: false
          - label: "Text"
            name: "text"
            widget: "text"
            hint: "Lämna en tom rad mellan stycken."
          - label: "Rubrik i den rosa rutan"
            name: "boxHeading"
            widget: "string"
          - label: "Bakgrundsbilder"
            name: "backgrounds"
            widget: "object"
            collapsed: false
            fields:
              - label: "På startsidan"
                name: "home"
                widget: "image"
              - label: "På kontaktsidan"
                name: "contact"
                widget: "image"
